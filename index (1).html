html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(circle at top left,rgba(255,215,0,.15),transparent 35%),linear-gradient(160deg,var(--bg),var(--bg2));-webkit-tap-highlight-color:transparent}
