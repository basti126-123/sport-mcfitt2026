<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>McFITT 2026</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #121212;
      --card: rgba(20, 20, 20, 0.95);
      --card-strong: #1a1a1a;
      --muted: #a8a8a8;
      --text: #f5f5f5;
      --accent: #ffd700;
      --accent-hover: #ffed4e;
      --success: #e8ff00;
      --success-2: #c9ff00;
      --warning: #ff9800;
      --line: rgba(255, 215, 0, 0.12);
      --shadow: 0 20px 50px rgba(255, 215, 0, 0.12);
      --glow: 0 0 24px rgba(255, 215, 0, 0.4);
      --neon-glow: 0 0 16px rgba(255, 215, 0, 0.5), 0 0 32px rgba(255, 215, 0, 0.2);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 215, 0, 0.15), transparent 35%),
        radial-gradient(circle at bottom right, rgba(232, 255, 0, 0.08), transparent 40%),
        linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.15px;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 14px 72px;
    }

    .hero {
      background: linear-gradient(145deg, rgba(30, 30, 30, 0.95), rgba(10, 10, 10, 0.98));
      border: 2px solid var(--accent);
      border-radius: 26px;
      padding: 22px 18px 18px;
      box-shadow: var(--neon-glow), inset 0 1px 0 rgba(255, 215, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -40% auto auto -30%;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.25), transparent 60%);
      pointer-events: none;
      filter: blur(30px);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -28%;
      bottom: -28%;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(232, 255, 0, 0.12), transparent 60%);
      pointer-events: none;
      filter: blur(30px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .brand .badge {
      background: rgba(255, 215, 0, 0.15);
      color: var(--accent-hover);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
    }

    h1 {
      font-size: clamp(28px, 7vw, 42px);
      margin: 16px 0 8px;
      line-height: 1.1;
      letter-spacing: -0.04em;
      position: relative;
      z-index: 1;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 0 40px rgba(255, 215, 0, 0.2);
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }

    .stat {
      background: rgba(255, 215, 0, 0.04);
      border: 1.5px solid var(--accent);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.15);
    }

    .stat strong {
      display: block;
      font-size: 17px;
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 3px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    .stat small {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.9px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0 18px;
      background: rgba(20, 20, 20, 0.95);
      border: 1.5px solid var(--accent);
      border-radius: 16px;
      padding: 6px;
      box-shadow: inset 0 0 16px rgba(255, 215, 0, 0.08);
    }

    .tabs button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 700;
      font-size: 13px;
      padding: 12px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tabs button.on {
      background: var(--accent);
      color: #000;
      box-shadow: var(--neon-glow);
      font-weight: 900;
    }

    .day,
    .ex,
    .rec,
    .mac {
      background: rgba(20, 20, 20, 0.92);
      border: 1.5px solid rgba(255, 215, 0, 0.2);
      border-radius: 16px;
      color: var(--text);
      transition: all 0.25s ease;
    }

    .day:hover,
    .ex:hover,
    .rec:hover,
    .mac:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(255, 215, 0, 0.15);
    }

    .day,
    .ex {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 15px 14px;
      font: inherit;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .day .g,
    .ex .g,
    .rec .g {
      flex: 1;
      min-width: 0;
    }

    .day b,
    .rec b {
      display: block;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    .day small,
    .rec small {
      color: var(--muted);
      font-size: 12px;
      display: block;
      margin-top: 4px;
    }

    .badge {
      background: rgba(255, 215, 0, 0.1);
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      padding: 7px 9px;
      letter-spacing: 0.7px;
      white-space: nowrap;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .today {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.08), rgba(20, 20, 20, 0.92));
      box-shadow: 0 0 24px rgba(255, 215, 0, 0.25);
    }

    .rest {
      opacity: 0.5;
      cursor: default;
    }

    .rest:hover {
      transform: none;
      border-color: rgba(255, 215, 0, 0.2);
      box-shadow: none;
    }

    .back {
      margin: 4px 0 14px;
      background: transparent;
      border: none;
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .back:hover {
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    .bar {
      height: 11px;
      background: rgba(255, 215, 0, 0.08);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0 18px;
      box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.1);
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--success), var(--success-2));
      box-shadow: 0 0 20px rgba(232, 255, 0, 0.5);
      transition: width 0.35s ease;
    }

    .ico {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(255, 215, 0, 0.08);
      font-size: 30px;
      flex: none;
      border: 1.5px solid var(--accent);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.15);
    }

    .ex b {
      font-size: 16px;
      display: block;
      font-weight: 700;
      color: var(--text);
    }

    .ex .m {
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
      margin: 4px 0 2px;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    .ex .t {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
    }

    .chk {
      width: 30px;
      height: 30px;
      border: 2.5px solid var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 800;
      flex: none;
      background: rgba(255, 215, 0, 0.05);
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .ex.done {
      opacity: 0.72;
      border-color: var(--success);
      animation: pulseComplete 0.45s ease-out;
    }

    .day.done-day {
      animation: dayGlow 0.5s ease-out;
    }

    @keyframes pulseComplete {
      0% { transform: scale(0.96); box-shadow: 0 0 0 rgba(232,255,0,0); }
      40% { transform: scale(1.02); box-shadow: 0 0 18px rgba(232,255,0,0.35); }
      100% { transform: scale(1); box-shadow: 0 0 0 rgba(232,255,0,0); }
    }

    @keyframes dayGlow {
      0% { box-shadow: 0 0 0 rgba(232,255,0,0); }
      50% { box-shadow: 0 0 24px rgba(232,255,0,0.35); }
      100% { box-shadow: 0 0 0 rgba(232,255,0,0); }
    }

    .ex.done b {
      text-decoration: line-through;
      color: var(--muted);
    }

    .ex.done .chk {
      background: var(--success);
      border-color: var(--success-2);
      color: #000;
      box-shadow: 0 0 20px rgba(232, 255, 0, 0.5);
      font-weight: 900;
    }

    .note {
      border: 1.5px solid var(--warning);
      background: rgba(255, 152, 0, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
      box-shadow: 0 0 12px rgba(255, 152, 0, 0.1);
    }

    .reset {
      margin-top: 22px;
      width: 100%;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.18), rgba(255, 152, 0, 0.08));
      color: #000;
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.25);
      animation: glowReset 1.6s ease-in-out infinite alternate;
    }

    @keyframes glowReset {
      from { box-shadow: 0 0 8px rgba(255, 215, 0, 0.25), 0 0 18px rgba(255, 152, 0, 0.14); }
      to { box-shadow: 0 0 16px rgba(255, 215, 0, 0.45), 0 0 28px rgba(255, 152, 0, 0.2); }
    }

    .reset:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .macs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .mac {
      padding: 12px 8px;
      text-align: center;
      margin: 0;
      background: rgba(255, 215, 0, 0.04);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
    }

    .mac b {
      display: block;
      color: var(--accent);
      font-size: 18px;
      margin-bottom: 4px;
      font-weight: 900;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
    }

    .mac small {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .rec {
      padding: 0;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .rec summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      cursor: pointer;
    }

    .rec summary::-webkit-details-marker { display: none; }

    .rec[open] summary {
      background: rgba(255, 215, 0, 0.04);
      border-bottom: 1px solid var(--line);
    }

    .rec .in {
      padding: 0 16px 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .rec .in ul,
    .rec .in ol {
      margin: 7px 0 12px;
      padding-left: 18px;
      color: var(--text);
    }

    .rec .in li { margin-bottom: 5px; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 6px;
    }

    .chips span {
      background: rgba(255, 215, 0, 0.05);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--muted);
      font-size: 12px;
      transition: all 0.2s ease;
    }

    .chips span:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
    }

    .gif {
      width: 84px;
      height: 84px;
      flex: none;
      background: rgba(255, 215, 0, 0.05);
      border: 1.5px solid var(--accent);
      border-radius: 14px;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.15);
    }

    .gif path, .gif line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .gif .bd { stroke: var(--accent); stroke-width: 4; }
    .gif .lg2 { stroke: var(--muted); stroke-width: 4; }
    .gif .pl { stroke: var(--accent); stroke-width: 3; }
    .gif .fl { stroke: rgba(255, 215, 0, 0.2); stroke-width: 2; }
    .gif .hd { fill: var(--accent); }
    .gif .wt { fill: var(--success); }

    @media (max-width: 440px) {
      .stats { grid-template-columns: 1fr; }
      .macs { grid-template-columns: 1fr; }
      .tabs { gap: 6px; }
    }
  </style>
</head>

        h += '<button class="day' + (p.w == td ? ' today' : '') + (isDone ? ' done-day' : '') + '" data-d="' + i + '"><div class="g"><b>' + p.d + '</b><small>' + p.t + '</small></div><span class="badge">' + cnt(i) + '/' + p.e.length + '</span></button>';
      });
      app.innerHTML = h;
      bindNav();
      app.querySelectorAll('button.day').forEach(function(b){
        b.onclick = function(){ day(+b.dataset.d); };
      });
    }

    function day(i){
      var p = P[i], n = cnt(i);
      var h = '<button class="back" id="bk">← Retour</button><h1 style="font-size:30px; margin: 0 0 8px;">' + p.d + '</h1><p class="sub">' + p.t + '</p>' + (p.n ? '<div class="note">⚠️ ' + p.n + '</div>' : '') + '<div class="bar"><i style="width:' + (n / p.e.length * 100) + '%"></i></div>';
      p.e.forEach(function(x, j){
        var d = S[i + '-' + j];
        var m = [x[1], x[2]].filter(Boolean).join(' · ');
        h += '<div class="ex' + (d ? ' done' : '') + '" data-j="' + j + '">' + (gk(x[0]) ? gsvg(gk(x[0])) : '<div class="ico">' + x[4] + '</div>') + '<div class="g"><b>' + x[0] + '</b>' + (m ? '<div class="m">' + m + '</div>' : '') + (x[3] ? '<div class="t">' + x[3] + '</div>' : '') + '</div><div class="chk">' + (d ? '✓' : '') + '</div></div>';
      });
      h += '<button class="reset" id="rs">Réinitialiser la séance</button>';
      app.innerHTML = h;
      window.scrollTo(0, 0);
      document.getElementById('bk').onclick = home;
      document.getElementById('rs').onclick = function(){
        p.e.forEach(function(_, j){ delete S[i + '-' + j]; });
        save();
        day(i);
      };
      app.querySelectorAll('.ex').forEach(function(el){
        el.onclick = function(){
          var key = i + '-' + el.dataset.j;
          if (S[key]) delete S[key]; else S[key] = 1;
          save();
          var y = window.scrollY;
          day(i);
          window.scrollTo(0, y);
        };
      });
    }

    function food(){
      var h = '<section class="hero" style="padding-bottom:20px"><div class="brand"><span class="badge">Nutrition</span></div><h1 style="margin-top:16px; font-size:32px;">McFITT</h1><p class="sub">Prise de muscle • Jambes • Fessiers • Performance</p><div class="stats"><div class="stat"><strong>100-135g</strong><small>Protéines</small></div><div class="stat"><strong>230-250g</strong><small>Glucides</small></div><div class="stat"><strong>50-60g</strong><small>Lipides</small></div></div></section>' + nav(1);

      R.forEach(function(r){

    }

    var G = {

      rdl:{a:[50,14,50,26,50,52,50,71,52,88,50,39,50,52],b:[74,38,66,42,40,52,44,70,46,88,66,54,66,66],w:1},
      sq:{a:[50,14,50,26,50,52,50,71,52,88,50,39,52,50],b:[48,35,46,46,38,70,58,66,54,88,52,56,56,58],w:1},
      lc:{a:[14,66,24,68,50,70,68,70,86,70,18,74,10,72],b:[14,66,24,68,50,70,68,70,58,54,18,74,10,72],L:[8,76,72,76]},
      kb:{a:[68,26,62,34,46,54,50,72,52,88,72,42,80,48,44,72,44,88],b:[68,26,62,34,46,54,34,66,18,70,72,42,80,48,44,72,44,88]},
      ab:{a:[50,14,50,26,50,52,52,71,54,88,56,36,62,44,48,71,46,88],b:[50,14,50,26,50,52,38,66,28,80,56,36,62,44,48,71,46,88]},
      bg:{a:[50,14,50,26,50,52,54,70,58,88,50,39,50,51,36,64,24,70],b:[50,26,50,38,50,64,68,68,58,88,50,51,50,63,38,76,24,70],L:[14,72,32,72]},
      lat:{a:[40,32,40,44,40,70,60,64,62,86,44,28,50,10],b:[38,32,38,44,40,70,60,64,62,86,46,56,50,42],w:1,L:[30,72,50,72]},
      row:{a:[34,34,34,46,36,72,56,66,60,86,48,48,62,50],b:[34,34,34,46,36,72,56,66,60,86,26,58,40,56],w:1,L:[26,74,48,74]},
      cu:{a:[50,14,50,26,50,52,50,71,52,88,50,39,52,51],b:[50,14,50,26,50,52,50,71,52,88,50,39,58,28],w:1},
      fp:{a:[50,14,50,26,50,52,50,71,52,88,62,27,74,28],b:[50,14,50,26,50,52,50,71,52,88,60,26,54,14],w:1},
      po:{a:[68,26,62,34,46,54,46,72,48,88,72,30,84,24],b:[68,26,62,34,46,54,46,72,48,88,64,48,58,60],w:1},
      pr:{a:[12,40,18,48,32,70,50,62,66,50,24,62,32,62],b:[12,40,18,48,32,70,44,54,56,68,24,62,32,62],L:[8,70,34,76]},
      st:{a:[50,14,50,26,50,52,62,64,60,80,50,39,50,51,46,72,44,88],b:[58,6,58,18,60,44,62,62,60,80,58,31,58,43,70,56,68,70],L:[54,80,72,80]},

      cr:{a:[12,80,22,82,48,84,60,66,70,84,16,74,12,78],b:[24,64,30,70,48,84,60,66,70,84,28,60,22,66]},
      lr:{a:[12,80,22,82,46,84,64,84,82,84,32,86,40,86],b:[12,80,22,82,46,84,48,64,48,46,32,86,40,86]},
      le:{a:[34,32,34,44,36,70,56,70,56,88,40,56,44,66],b:[34,32,34,44,36,70,56,70,76,68,40,56,44,66],L:[26,74,58,74]},
      be:{a:[56,82,52,74,40,52,32,68,26,84,54,80,50,76],b:[66,28,58,34,40,52,32,68,26,84,60,42,54,40],w:1,L:[28,52,46,56]}
    };

    var M = [
      [/hip thrust/, 'ht'],
      [/rdl/, 'rdl'],

      [/leg curl/, 'lc'],
      [/kick/, 'kb'],

      [/lat pull/, 'lat'],
      [/row|seated/, 'row'],
      [/curl|biceps|barre à poids/, 'cu'],

      [/marche/, 'wk'],

      [/back ext/, 'be'],
      [/leg ext/, 'le']
    ];

    function gk(n){
      n = n.toLowerCase();
      for (var i = 0; i < M.length; i++) {
        if (M[i][0].test(n)) return M[i][1];
      }
      return null;
    }

    function gsvg(k){
      return '<svg class="gif" data-k="' + k + '" viewBox="0 0 100 100"><line class="fl" x1="4" y1="90" x2="96" y2="90"/><path class="pl"/><path class="lg2"/><path class="bd"/><circle class="hd" r="5.5"/><circle class="wt" r="4"/></svg>';
    }

    function tick(ts){
      var t = (1 - Math.cos(ts * Math.PI / 1200)) / 2;
      document.querySelectorAll('svg.gif').forEach(function(s){
        var g = G[s.dataset.k];
        if (!g) return;
        var p = g.a.map(function(v, i){ return +(v + (g.b[i] - v) * t).toFixed(1); });
        var q = function(a, b){ return p[a] + ',' + p[b]; };
        s.querySelector('.bd').setAttribute('d', 'M' + q(2,3) + 'L' + q(4,5) + 'L' + q(6,7) + 'L' + q(8,9) + 'M' + q(2,3) + 'L' + q(10,11) + 'L' + q(12,13));
        s.querySelector('.lg2').setAttribute('d', p.length > 14 ? 'M' + q(4,5) + 'L' + q(14,15) + 'L' + q(16,17) : '');
        s.querySelector('.pl').setAttribute('d', g.L ? 'M' + g.L[0] + ',' + g.L[1] + 'L' + g.L[2] + ',' + g.L[3] : '');

        h.setAttribute('cx', p[0]);
        h.setAttribute('cy', p[1]);
        var w = s.querySelector('.wt');
        w.style.display = g.w ? '' : 'none';
        w.setAttribute('cx', p[12]);
        w.setAttribute('cy', p[13]);
      });
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
    home();
  </script>
