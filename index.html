<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>McFITT 2026 - Mon Programme</title>
<style>
:root {
  --bg: #0f1419;
  --card: #1a1f2e;
  --card-hover: #232b3f;
  --tx: #e8ecf1;
  --tx-secondary: #a0aac5;
  --accent: #00d9ff;
  --accent-hover: #00b8d4;
  --success: #00e676;
  --success-light: #4caf50;
  --warning: #ff6b35;
  --bd: #2a3342;
  --shadow: 0 8px 32px rgba(0, 217, 255, 0.15);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.4);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
  color: var(--tx);
  font-family: -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  -webkit-tap-highlight-color: transparent;
  font-weight: 400;
  letter-spacing: 0.3px;
}

main {
  max-width: 540px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

h1 {
  font-size: 32px;
  margin: 0 0 8px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #00b8d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

h2 {
  font-size: 18px;
  margin: 28px 0 14px;
  font-weight: 600;
  color: var(--tx);
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.9;
}

.sub {
  color: var(--tx-secondary);
  margin: 0 0 20px;
  font-size: 14px;
  line-height: 1.5;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  background: var(--card);
  padding: 6px;
  border-radius: 14px;
  border: 1px solid var(--bd);
}

.tabs button {
  flex: 1;
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  background: transparent;
  color: var(--tx-secondary);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-size: 13px;
}

.tabs button:hover {
  color: var(--tx);
}

.tabs button.on {
  background: linear-gradient(135deg, var(--accent), #00b8d4);
  color: #0f1419;
  box-shadow: 0 4px 16px rgba(0, 217, 255, 0.3);
}

.day,
.ex,
.rec,
.mac {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  margin-bottom: 12px;
  color: var(--tx);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.day:hover,
.ex:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow);
  transform: translateY(-2px);
}

.day,
.ex {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  padding: 16px;
  font: inherit;
  cursor: pointer;
}

.day b {
  display: block;
  font-size: 18px;
  font-weight: 600;
}

.day small {
  color: var(--tx-secondary);
  font-size: 13px;
  margin-top: 4px;
}

.day .g {
  flex: 1;
}

.badge {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  background: rgba(0, 217, 255, 0.1);
  padding: 6px 12px;
  border-radius: 20px;
}

.today {
  border-color: var(--accent);
  box-shadow: var(--shadow);
  background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), rgba(0, 184, 212, 0.05));
}

.rest {
  opacity: 0.5;
  cursor: default;
}

.rest:hover {
  border-color: var(--bd);
  box-shadow: none;
  transform: none;
}

.back {
  background: none;
  border: 0;
  color: var(--accent);
  font: inherit;
  font-weight: 600;
  padding: 8px 0;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  margin-bottom: 16px;
}

.back:hover {
  color: var(--accent-hover);
}

.bar {
  height: 10px;
  background: var(--bd);
  border-radius: 10px;
  overflow: hidden;
  margin: 16px 0 24px;
  border: 1px solid var(--bd);
}

.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--success), var(--success-light));
  width: 0;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
}

.ico {
  font-size: 32px;
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, rgba(0, 217, 255, 0.1), rgba(0, 184, 212, 0.05));
  border-radius: 14px;
  flex: none;
  border: 1px solid var(--bd);
}

.ex .g {
  flex: 1;
}

.ex b {
  font-size: 16px;
  display: block;
  font-weight: 600;
}

.ex .m {
  color: var(--accent);
  font-weight: 600;
  font-size: 13px;
  margin: 4px 0 2px;
}

.ex .t {
  color: var(--tx-secondary);
  font-size: 13px;
  line-height: 1.5;
  margin-top: 4px;
}

.chk {
  width: 32px;
  height: 32px;
  border: 2.5px solid var(--accent);
  border-radius: 50%;
  flex: none;
  display: grid;
  place-items: center;
  color: var(--accent);
  font-weight: 700;
  font-size: 16px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.ex.done {
  opacity: 0.6;
  border-color: var(--success);
}

.ex.done b {
  text-decoration: line-through;
  color: var(--tx-secondary);
}

.ex.done .chk {
  background: linear-gradient(135deg, var(--success), var(--success-light));
  border-color: var(--success);
  color: #fff;
  box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3);
}

.note {
  background: linear-gradient(135deg, rgba(255, 107, 53, 0.1), rgba(255, 107, 53, 0.05));
  border-left: 4px solid var(--warning);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 20px;
  font-size: 14px;
  border: 1px solid var(--bd);
  color: var(--tx);
}

.reset {
  margin-top: 24px;
  background: none;
  border: 1.5px solid var(--bd);
  color: var(--tx-secondary);
  border-radius: 12px;
  padding: 12px 16px;
  font: inherit;
  cursor: pointer;
  width: 100%;
  transition: all 0.3s;
  font-weight: 600;
  font-size: 14px;
}

.reset:hover {
  border-color: var(--warning);
  color: var(--warning);
  background: rgba(255, 107, 53, 0.05);
}

.macs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.mac {
  padding: 16px 12px;
  text-align: center;
  margin: 0;
  background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), rgba(0, 184, 212, 0.05));
  border: 1px solid var(--bd);
}

.mac b {
  display: block;
  font-size: 18px;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 4px;
}

.mac small {
  color: var(--tx-secondary);
  font-size: 12px;
  font-weight: 500;
}

.rec {
  padding: 0;
}

.rec summary {
  list-style: none;
  padding: 16px;
  cursor: pointer;
  display: flex;
  gap: 14px;
  align-items: center;
  transition: all 0.3s;
}

.rec summary::-webkit-details-marker {
  display: none;
}

.rec[open] summary {
  background: rgba(0, 217, 255, 0.05);
  border-bottom: 1px solid var(--bd);
}

.rec .g {
  flex: 1;
}

.rec b {
  display: block;
  font-size: 16px;
  font-weight: 600;
}

.rec small {
  color: var(--tx-secondary);
  font-size: 12px;
  margin-top: 4px;
}

.rec .in {
  padding: 0 16px 16px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--tx-secondary);
}

.rec ul,
.rec ol {
  margin: 8px 0 12px;
  padding-left: 24px;
  color: var(--tx);
}

.rec li {
  margin-bottom: 6px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chips span {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 22px;
  padding: 8px 14px;
  font-size: 13px;
  color: var(--tx-secondary);
  transition: all 0.3s;
}

.chips span:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(0, 217, 255, 0.05);
}

.gif {
  width: 84px;
  height: 84px;
  flex: none;
  background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), rgba(0, 184, 212, 0.05));
  border-radius: 14px;
  border: 1px solid var(--bd);
}

.gif path,
.gif line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.gif .bd {
  stroke: var(--accent);
  stroke-width: 4;
}

.gif .lg2 {
  stroke: var(--tx-secondary);
  stroke-width: 4;
}

.gif .pl {
  stroke: var(--accent);
  stroke-width: 3;
}

.gif .fl {
  stroke: var(--bd);
  stroke-width: 2;
}

.gif .hd {
  fill: var(--accent);
}

.gif .wt {
  fill: var(--success);
}

@media (max-width: 600px) {
  h1 {
    font-size: 28px;
  }

  main {
    padding: 16px 12px 60px;
  }

  .day,
  .ex {
    padding: 14px;
    gap: 12px;
  }
}
</style>
</head>
