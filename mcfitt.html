<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>McFITT 2026</title>
<style>
:root{--bg:#0a0a0a;--bg2:#121212;--muted:#a8a8a8;--text:#f5f5f5;--accent:#ffd700;--ok:#e8ff00;--ok2:#c9ff00;--warn:#ff9800;--line:rgba(255,215,0,.12);--neon:0 0 16px rgba(255,215,0,.5),0 0 32px rgba(255,215,0,.2)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(circle at top left,rgba(255,215,0,.15),transparent 35%),linear-gradient(160deg,var(--bg),var(--bg2));-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:18px 14px 72px}
.hero{background:linear-gradient(145deg,rgba(30,30,30,.95),rgba(10,10,10,.98));border:2px solid var(--accent);border-radius:26px;padding:22px 18px 18px;box-shadow:var(--neon)}
h1{font-size:clamp(28px,7vw,42px);margin:12px 0 8px;line-height:1.1;font-weight:900;color:var(--accent);text-shadow:0 0 20px rgba(255,215,0,.5)}
h2{color:var(--accent);font-size:18px;margin:22px 0 10px}
.sub{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.badge{background:rgba(255,215,0,.12);color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;font-size:11px;font-weight:800;padding:7px 9px;letter-spacing:.7px;white-space:nowrap;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{border:1.5px solid var(--accent);border-radius:14px;padding:12px 8px;text-align:center;background:rgba(255,215,0,.04)}
.stat strong{display:block;font-size:17px;font-weight:900;color:var(--accent)}
.stat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.9px}
.tabs{display:flex;gap:10px;margin:20px 0 16px;background:rgba(20,20,20,.95);border:1.5px solid var(--accent);border-radius:16px;padding:6px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:12px 10px;border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#000;box-shadow:var(--neon);font-weight:900}
.day,.ex,.rec,.wk{background:rgba(20,20,20,.92);border:1.5px solid rgba(255,215,0,.2);border-radius:16px;color:var(--text)}
.day,.ex{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;font:inherit;cursor:pointer;margin-bottom:10px}
.g{flex:1;min-width:0}
.day b,.rec b,.wk b{display:block;font-size:16px;color:var(--accent)}
.day small,.rec small,.wk small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.today{border-color:var(--accent);box-shadow:0 0 24px rgba(255,215,0,.25)}
.rest{opacity:.5;cursor:default}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;padding:0;margin:4px 0 14px;cursor:pointer}
.bar{height:11px;background:rgba(255,215,0,.08);border:1.5px solid var(--accent);border-radius:999px;overflow:hidden;margin:12px 0}
.bar.sm{height:7px;border-width:1px;margin:8px 0 0}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--ok),var(--ok2));box-shadow:0 0 18px rgba(232,255,0,.5);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ico{width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:rgba(255,215,0,.08);font-size:30px;flex:none;border:1.5px solid var(--accent)}
.ex b{font-size:16px;display:block;color:var(--text)}
.ex .m{color:var(--accent);font-weight:700;font-size:12px;margin:4px 0 2px}
.ex .t{color:var(--muted);font-size:12px;line-height:1.5;margin-top:4px}
.chk{width:30px;height:30px;border:2.5px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-weight:800;flex:none}
.ex.done{opacity:.72;border-color:var(--ok)}
.ex.done b{text-decoration:line-through;color:var(--muted)}
.ex.done .chk{background:var(--ok);border-color:var(--ok2);color:#000;box-shadow:0 0 20px rgba(232,255,0,.5)}
.ex.pop,.c.d{animation:pop .5s ease-out}
.ex.pop .chk{animation:chk .5s ease-out}
@keyframes pop{0%{transform:scale(.96)}40%{transform:scale(1.03);box-shadow:0 0 22px rgba(232,255,0,.45)}100%{transform:scale(1)}}
@keyframes chk{0%{transform:scale(.3) rotate(-90deg)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
.note{border:1.5px solid var(--warn);background:rgba(255,152,0,.08);border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.win{text-align:center;font-weight:900;color:#000;background:linear-gradient(90deg,var(--ok),var(--ok2));border-radius:14px;padding:14px;margin-bottom:14px;animation:win .7s ease-out}
@keyframes win{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.reset{margin-top:20px;width:100%;background:rgba(255,215,0,.15);color:var(--accent);border:1.5px solid var(--accent);border-radius:12px;padding:14px;font:inherit;font-weight:900;cursor:pointer}
.mh{display:flex;align-items:center;justify-content:space-between}
.mh b{font-size:20px;color:var(--accent);text-transform:capitalize}
.mh button{background:rgba(255,215,0,.1);border:1.5px solid var(--accent);color:var(--accent);border-radius:12px;width:42px;height:38px;font-size:18px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0 6px;text-align:center}
.cal span{color:var(--muted);font-size:11px;text-transform:uppercase}
.c{aspect-ratio:1;border-radius:10px;border:1.5px solid rgba(255,215,0,.2);background-color:rgba(20,20,20,.9);color:var(--text);font:inherit;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0;cursor:pointer;background-image:linear-gradient(to top,rgba(232,255,0,.5) var(--p,0%),transparent var(--p,0%))}
.c.r{opacity:.4;cursor:default}
.c.t{border-color:var(--accent);box-shadow:0 0 12px rgba(255,215,0,.45)}
.c.d{border-color:var(--ok);color:#000;background:var(--ok)}
.wk{margin-bottom:10px;overflow:hidden}
.wk summary{list-style:none;padding:14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.wk summary::-webkit-details-marker,.rec summary::-webkit-details-marker{display:none}
.wk .in{padding:0 12px 4px}
.wk[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
.rec{margin-bottom:10px;overflow:hidden}
.rec summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 12px;cursor:pointer}
.rec .in{padding:0 16px 14px;color:var(--muted);font-size:13px;line-height:1.6}
.rec .in ul,.rec .in ol{margin:7px 0 12px;padding-left:18px;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chips span{background:rgba(255,215,0,.05);border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px}
.gif{width:84px;height:84px;flex:none;background:rgba(255,215,0,.05);border:1.5px solid var(--accent);border-radius:14px}
.gif path,.gif line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.gif .bd{stroke:var(--accent);stroke-width:4}.gif .lg2{stroke:var(--muted);stroke-width:4}.gif .pl{stroke:var(--accent);stroke-width:3}.gif .fl{stroke:rgba(255,215,0,.2);stroke-width:2}
.gif .hd{fill:var(--accent)}.gif .wt{fill:var(--ok)}
</style>
</head>
<body>
<main id="app"></main>
<script>
// [nom, séries, poids, commentaire, icône]
// ================= À MODIFIER ICI =================
// Un exercice = ["Nom","Séries","Poids","Commentaire","Icône"]
// Le GIF s'affiche tout seul si le nom contient un mot connu (voir la liste M plus bas).
var SEANCES={
jambes1:{t:"Jambes & fessiers 1 (ischios)",e:[
["Hip thrust","4×10 (1×12 + 3×8)","25 kg","","🍑"],
["RDL","4×8-10","25 kg","","⬇️"],
["Sumo squat","3×10","","","🏋️"],
["Leg curl","4×10","36-41 kg","","〰️"],
["Kick back","3×12","","Abduction si le kick back n'est pas possible.","🦶"],
["Fentes bulgares","","","","🦵"]]},
jambes2:{t:"Jambes & fessiers 2",e:[
["Abducteurs","3×12-16 (6-8 penchée + 6-8 droite)","39 kg","Se pencher vers l'avant.","↔️"],
["Hip thrust","4×10 (1×12 + 3×8)","20 kg","","🍑"],
["RDL","4×8-10","","","⬇️"],
["Fentes bulgares","3×8-10","","","🦵"],
["Kick back","3×8-10","","","🦶"],
["Presse","4×10","79 kg","Pieds hauts.","🦿"],
["Step up à la poulie","","","","🪜"]]},
jambes3:{t:"Jambes & fessiers 3 (full leg)",e:[
["Presse","4×10","","","🦿"],
["Squat","3×8-10","","","🏋️"],
["Fentes bulgares","3×10","","","🦵"],
["Gobelet squat","3×12-15","","Pied surélevé avec un poids.","🥤"],
["Leg extension","3×10-12","","","📐"],
["Leg curl","3×10-12","","","〰️"]]},
dosA:{t:"Dos - biceps - triceps",n:"Ne jamais fermer le pouce.",e:[
["Tirage vertical","4×8-10","41,3 kg","Assis, tirage bras latéral. Écarter un max le pouce et le rapprocher du poing, sans le fermer.","🔽"],
["Tirage horizontal","4×8-10","25 kg","Tirer vers soi, assise, sans bouger le corps.","🚣"],
["Curl biceps poulie basse","3×10","","Paume vers le ciel.","💪"],
["Curl marteau","4×10","11,3 kg","À la poulie avec la corde.","🔨"],
["Rope pushdown triceps","3×12","","Coudes collés au corps, écarter la corde en bas.","🔻"],
["Overhead extension","3×12","","Coudes vers le haut, tendre les bras au-dessus de la tête.","🙆"]]},
dosB:{t:"Dos - épaules",e:[
["Face pull","4×12","","Tirer vers la tête, sur les côtés.","🎯"],
["Tirage vertical","4×8-10","","Ne pas tenir avec les pouces.","🔽"],
["Single arm row","3×10 / bras","","Tirer le coude vers la hanche.","💪"],
["Straight arm pulldown (ou tractions)","3×12","","Optionnel. Bras tendus, descendre la barre vers les cuisses.","⬇️"],
["Élévations latérales","3×15","","Haltères légers.","🕊️"],
["Développé militaire","3×10","","Pousser au-dessus de la tête sans cambrer.","⬆️"]]}
};
// Planning : lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche (null = repos)
var PLAN=["jambes1","dosA",null,"jambes2","dosB","jambes3",null];
// ==================================================
var R=[
["Porridge banane-amandes","Petit-déjeuner",480,17,75,12,["60 g de flocons d'avoine","250 ml de lait","1 banane","15 g d'amandes","Cannelle"],["Chauffer l'avoine avec le lait 4-5 min en remuant.","Ajouter la banane en rondelles, les amandes et la cannelle."],"🥣"],
["Omelette avocat-pain","Petit-déjeuner",600,26,30,40,["3 œufs","½ avocat","2 tranches de pain","Sel, poivre"],["Battre les œufs et cuire l'omelette à la poêle.","Servir avec l'avocat écrasé sur le pain grillé."],"🍳"],
["Bowl poulet-riz","Midi",590,48,65,14,["150 g de poulet (cru)","80 g de riz (cru)","Légumes au choix","1 c. à s. d'huile d'olive"],["Cuire le riz.","Saisir le poulet en morceaux dans l'huile 8-10 min.","Assembler avec les légumes."],"🍚"],
["Pâtes au thon","Midi",560,38,70,10,["90 g de pâtes (cru)","1 boîte de thon au naturel","Tomates","1 c. à c. d'huile d'olive"],["Cuire les pâtes.","Mélanger avec le thon émietté, les tomates et l'huile."],"🍝"],
["Saumon et pommes de terre","Soir",540,30,55,20,["130 g de saumon","300 g de pommes de terre","Haricots verts"],["Cuire les pommes de terre à l'eau ou au four 25 min.","Cuire le saumon 8-10 min à la poêle ou au four.","Servir avec les haricots verts."],"🐟"],
["Poulet et pommes de terre rôties","Soir",560,45,50,16,["150 g de poulet","300 g de pommes de terre","1 c. à s. d'huile d'olive","Herbes"],["Couper les pommes de terre, les mélanger à l'huile et aux herbes.","Enfourner 30 min à 200 °C avec le poulet en morceaux."],"🍗"],
["Tartine beurre de cacahuète-banane","Avant la salle",430,12,60,14,["2 tranches de pain","1 c. à s. de beurre de cacahuète","1 banane"],["Tartiner le pain, ajouter la banane en rondelles."],"🍌"],
["Fromage blanc, fruits rouges et noix","Après la salle",330,22,22,16,["200 g de fromage blanc","100 g de fruits rouges","15 g de noix"],["Mélanger le tout dans un bol."],"🍓"]
];
var F={"Glucides":["Bananes","Pastèque","Pommes","Pommes de terre","Riz","Fruits rouges","Pain"],"Lipides":["Amandes","Noix","Noisettes","Pistaches","Beurre de cacahuète","Avocat","Huile d'olive","Poissons gras","Jaune d'œuf","Fromages"],"Protéines":["Poulet","Saumon","Poissons","Thon","Œufs"]};
var S={},app=document.getElementById("app");
try{S=JSON.parse(localStorage.getItem("prog3")||"{}")}catch(e){}
function save(){try{localStorage.setItem("prog3",JSON.stringify(S))}catch(e){}}
var JOURS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"],MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var now=new Date(),V={y:now.getFullYear(),m:now.getMonth()},openW=-1,LP={};
function ks(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function ji(d){return (d.getDay()+6)%7}
function ses(d){var k=PLAN[ji(d)];return k?SEANCES[k]:null}
function tot(d){var s=ses(d);return s?s.e.length:0}
function fait(d){var s=ses(d),n=0;if(s)s.e.forEach(function(_,j){if(S[ks(d)+"_"+j])n++});return n}
function inM(d){return d.getMonth()==V.m}
function prog(days){var f=0,t=0;days.forEach(function(d){f+=fait(d);t+=tot(d)});return{f:f,t:t,p:t?Math.round(f/t*100):0}}
function weeks(){var a=[],last=new Date(V.y,V.m+1,0),d=new Date(V.y,V.m,1);d.setDate(1-ji(d));
while(d<=last){var w=[];for(var i=0;i<7;i++){w.push(new Date(d));d.setDate(d.getDate()+1)}a.push(w)}return a}
function animBars(){setTimeout(function(){app.querySelectorAll(".bar i").forEach(function(i){i.style.width=i.dataset.w+"%"})},60)}
function nav(a){return '<div class="tabs"><button class="'+(a?'':'on')+'" id="t1">🏋️ Séances</button><button class="'+(a?'on':'')+'" id="t2">🥗 Alimentation</button></div>'}
function bindNav(){document.getElementById("t1").onclick=home;document.getElementById("t2").onclick=food}
function home(){
var ws=weeks(),md=[].concat.apply([],ws).filter(inM),all=prog(md),ns=0,nt=0;
md.forEach(function(d){if(tot(d)){nt++;if(fait(d)==tot(d))ns++}});
var h='<section class="hero"><span class="badge">'+MOIS[V.m]+' '+V.y+'</span><h1>McFITT</h1><p class="sub">Jambes • Dos • Épaules • Bras</p><div class="stats"><div class="stat"><strong>'+all.p+'%</strong><small>Mois</small></div><div class="stat"><strong>'+ns+'/'+nt+'</strong><small>Séances</small></div><div class="stat"><strong>'+all.f+'/'+all.t+'</strong><small>Exos</small></div></div></section>'+nav(0);
h+='<div class="mh"><button id="pm">‹</button><b>'+MOIS[V.m]+' '+V.y+'</b><button id="nm">›</button></div><div class="bar"><i data-w="'+all.p+'"></i></div><div class="cal">'+JOURS.map(function(j){return '<span>'+j[0]+'</span>'}).join('');
ws.forEach(function(w){w.forEach(function(d){
if(!inM(d)){h+='<span></span>';return}
var t=tot(d),f=fait(d),c='c'+(t?'':' r')+(ks(d)==ks(now)?' t':'')+(t&&f==t?' d':'');
h+='<'+(t?'button':'div')+' class="'+c+'" style="--p:'+(t?f/t*100:0)+'%"'+(t?' data-t="'+d.getTime()+'"':'')+'>'+d.getDate()+'</'+(t?'button':'div')+'>'})});
h+='</div><h2>Semaines</h2>';
ws.forEach(function(w,i){
var wp=prog(w.filter(inM)),cur=w.some(function(d){return ks(d)==ks(now)});
h+='<details class="wk" data-i="'+i+'"'+((openW==i||(openW<0&&cur))?' open':'')+'><summary><div class="g"><b>Semaine '+(i+1)+'</b><small>'+w[0].getDate()+' '+MOIS[w[0].getMonth()]+' – '+w[6].getDate()+' '+MOIS[w[6].getMonth()]+'</small><div class="bar sm"><i data-w="'+wp.p+'"></i></div></div><span class="badge">'+wp.p+'%</span></summary><div class="in">';
w.filter(inM).forEach(function(d){
var s=ses(d),n=JOURS[ji(d)]+' '+d.getDate();
if(!s){h+='<div class="day rest"><div class="g"><b>'+n+'</b><small>Repos</small></div><span style="font-size:26px">😴</span></div>';return}
var f=fait(d);
h+='<button class="day'+(ks(d)==ks(now)?' today':'')+'" data-t="'+d.getTime()+'"><div class="g"><b>'+n+'</b><small>'+s.t+'</small><div class="bar sm"><i data-w="'+Math.round(f/s.e.length*100)+'"></i></div></div><span class="badge">'+f+'/'+s.e.length+'</span></button>'});
h+='</div></details>'});
app.innerHTML=h;bindNav();window.scrollTo(0,0);
function mv(n){V.m+=n;if(V.m<0){V.m=11;V.y--}if(V.m>11){V.m=0;V.y++}openW=-1;home()}
document.getElementById("pm").onclick=function(){mv(-1)};document.getElementById("nm").onclick=function(){mv(1)};
app.querySelectorAll("details.wk").forEach(function(el){el.ontoggle=function(){if(el.open)openW=+el.dataset.i}});
app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){day(new Date(+b.dataset.t))}});
animBars()}
function day(d,pj){
var s=ses(d),k=ks(d),n=fait(d),t=s.e.length,p=Math.round(n/t*100),old=LP[k]||0;LP[k]=p;
var h='<button class="back" id="bk">← Retour</button><h1 style="font-size:30px">'+JOURS[ji(d)]+' '+d.getDate()+' '+MOIS[d.getMonth()]+'</h1><p class="sub">'+s.t+'</p>'+(s.n?'<div class="note">⚠️ '+s.n+'</div>':'')+(n==t?'<div class="win">🎉 Séance terminée !</div>':'')+'<div class="bar"><i style="width:'+old+'%" data-w="'+p+'"></i></div>';
s.e.forEach(function(x,j){var dn=S[k+"_"+j],m=[x[1],x[2]].filter(Boolean).join(" · ");
h+='<div class="ex'+(dn?' done':'')+(dn&&j===pj?' pop':'')+'" data-j="'+j+'">'+(gk(x[0])?gsvg(gk(x[0])):'<div class="ico">'+x[4]+'</div>')+'<div class="g"><b>'+x[0]+'</b>'+(m?'<div class="m">'+m+'</div>':'')+(x[3]?'<div class="t">'+x[3]+'</div>':'')+'</div><div class="chk">'+(dn?'✓':'')+'</div></div>'});
h+='<button class="reset" id="rs">Réinitialiser la séance</button>';
var y=pj===undefined?0:window.scrollY;app.innerHTML=h;window.scrollTo(0,y);
document.getElementById("bk").onclick=home;
document.getElementById("rs").onclick=function(){s.e.forEach(function(_,j){delete S[k+"_"+j]});save();day(d)};
app.querySelectorAll(".ex").forEach(function(el){el.onclick=function(){var q=k+"_"+el.dataset.j;if(S[q])delete S[q];else S[q]=1;save();day(d,+el.dataset.j)}});
animBars()}
function food(){
var h='<section class="hero"><span class="badge">Nutrition</span><h1>McFITT</h1><p class="sub">Prise de muscle • Jambes • Fessiers • Performance</p><div class="stats"><div class="stat"><strong>100-135g</strong><small>Protéines</small></div><div class="stat"><strong>230-250g</strong><small>Glucides</small></div><div class="stat"><strong>50-60g</strong><small>Lipides</small></div></div></section>'+nav(1)+'<h2>Recettes</h2>';
R.forEach(function(r){h+='<details class="rec"><summary><div class="ico">'+r[8]+'</div><div class="g"><b>'+r[0]+'</b><small>'+r[1]+' · ~'+r[2]+' kcal · P '+r[3]+'g · G '+r[4]+'g · L '+r[5]+'g</small></div></summary><div class="in"><b>Ingrédients</b><ul>'+r[6].map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul><b>Préparation</b><ol>'+r[7].map(function(x){return '<li>'+x+'</li>'}).join("")+'</ol></div></details>'});
h+='<h2>Aliments clés</h2>';
for(var k in F)h+='<p class="sub" style="margin:10px 0 6px"><b>'+k+'</b></p><div class="chips">'+F[k].map(function(x){return '<span>'+x+'</span>'}).join("")+'</div>';
app.innerHTML=h;bindNav();window.scrollTo(0,0)}
